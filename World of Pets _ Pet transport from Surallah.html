<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World of Pets | Pet transport from Surallah</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--mist:#eaf6fd;--ink:#0f4379;--soft:#4d6d8f;--sky:#3fb0e3;--azure:#0377d0;--navy:#0f4379;--line:#c9e4f5;--wm:#0f4379;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#082745;--mist:#0c3560;--ink:#eaf6fd;--soft:#9cc3e3;--line:#1b4a79;--wm:#fff}}
:root[data-theme="dark"]{--bg:#082745;--mist:#0c3560;--ink:#eaf6fd;--soft:#9cc3e3;--line:#1b4a79;--wm:#fff}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 'Instrument Sans',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--azure);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.btn{display:inline-block;border:0;border-radius:999px;padding:15px 28px;font:600 16px 'Instrument Sans',sans-serif;text-decoration:none;cursor:pointer;background:var(--azure);color:#fff;transition:transform .2s,background .2s}
.btn:hover{background:var(--navy);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;color:var(--soft)}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:22px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:800 18px 'Bricolage Grotesque',sans-serif}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-weight:500;font-size:15px}
.nav ul a{text-decoration:none;color:var(--soft)}.nav ul a:hover{color:var(--ink)}
.hero-body{flex:1;display:grid;grid-template-columns:1fr minmax(340px,470px);gap:clamp(24px,5vw,72px);align-items:center;padding-top:clamp(24px,5vh,56px);padding-bottom:7vw}
.hero h1{font-size:clamp(38px,5.2vw,72px);max-width:11ch}
.hero p{max-width:34ch;color:var(--soft);font-size:19px;margin:22px 0 32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.wm{position:absolute;left:0;right:0;bottom:0;font:800 13.1vw/.86 'Bricolage Grotesque','Trebuchet MS',sans-serif;letter-spacing:-.045em;white-space:nowrap;overflow:hidden;padding:0 1.2vw 1.2vw;color:var(--sky)}
.wm i{display:inline-block;font-style:normal}.wm .n{color:var(--wm)}.wm .sp{width:.26em}
/* sections */
section{padding:clamp(72px,10vw,130px) 0}
.head{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end;margin-bottom:48px}
.head h2{font-size:clamp(32px,4.6vw,58px)}.head p{margin:0;color:var(--soft);max-width:44ch;justify-self:end}
.row{position:relative;display:grid;grid-template-columns:1.3fr 1.5fr .8fr auto;gap:20px;align-items:center;padding:26px 0}
.row .ln{position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--line);transform-origin:left}
.row h3{font-size:clamp(22px,2.6vw,32px)}
.row .price{font:800 26px 'Bricolage Grotesque',sans-serif;color:var(--azure)}.row .price small{font:400 14px 'Instrument Sans';color:var(--soft)}
.row .btn{padding:11px 22px;font-size:15px}
.svc{background:var(--mist)}
.svc .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 64px}
.svc .item{position:relative;padding:30px 0}
.svc h3{font-size:26px;margin-bottom:10px}.svc p{margin:0 0 14px;color:var(--soft);max-width:44ch}
.feat{background:var(--navy);color:#fff}
.feat .big{font-size:clamp(34px,5.4vw,72px);max-width:17ch}
.feat .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:clamp(24px,4vw,64px);margin-top:64px;align-items:start}
.feat .f{border-top:3px solid var(--sky);padding-top:20px}
.feat .f:nth-child(2){margin-top:44px}.feat .f:nth-child(3){margin-top:88px}
.feat h3{font-size:24px;margin-bottom:8px}.feat p{margin:0;color:#bfe3f6}
.form{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,6vw,90px);align-items:start}
.form h2{font-size:clamp(34px,5vw,64px);margin-bottom:18px}.form .side p{color:var(--soft);max-width:36ch}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{display:grid;gap:6px;font-weight:600;font-size:15px}.full{grid-column:1/-1}
input,select,textarea{font:400 16px 'Instrument Sans',sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--azure);outline:none;box-shadow:0 0 0 3px rgba(3,119,208,.22)}
.done{background:var(--mist);border-radius:28px;padding:36px}.done h3{font-size:30px;margin-bottom:12px}
footer{background:#0b3562;color:#d3ebf9;padding:64px 0 36px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer h3{font-size:15px;color:#fff;margin-bottom:12px;font-family:'Instrument Sans';font-weight:600;letter-spacing:0}
footer a,footer p{display:block;margin:0 0 8px;text-decoration:none;font-size:15px}footer a:hover{color:#fff}
footer .logo{width:96px;border-radius:50%;background:#fff;margin-bottom:14px}
footer .legal{margin-top:40px;font-size:13px;color:#8fb6d6}
@media(max-width:820px){.nav ul{display:none}.head,.form,.feat .cols,footer .cols,.svc .grid{grid-template-columns:1fr}
.head p{justify-self:start}.row{grid-template-columns:1fr auto;gap:8px 16px}.row .via{grid-column:1/-1;order:3}
.feat .f:nth-child(n){margin-top:0}form{grid-template-columns:1fr}

.hero-body{grid-template-columns:1fr;padding-bottom:24px}.hero{min-height:0;padding-bottom:16vw}.wm{position:relative}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

.pets{border-radius:28px 28px 28px 6px;overflow:hidden;aspect-ratio:470/481;width:100%;max-width:380px}.pets img{width:100%;height:100%;object-fit:cover;display:block}
.cal{background:var(--bg);border:1.5px solid var(--line);border-radius:28px;padding:22px;position:relative;z-index:2;box-shadow:0 30px 60px -30px rgba(15,67,121,.5)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cal-h h2{font-size:22px}
.cal-h button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer}.cal-h button:disabled{opacity:.3}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dow{font-size:13px;color:var(--soft);margin-bottom:4px}
.d{aspect-ratio:1;border:0;border-radius:14px;background:none;color:var(--ink);font:600 15px 'Instrument Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.d:hover:not(:disabled){background:var(--mist)}.d:disabled{opacity:.3;cursor:default}.d.sel{background:var(--navy);color:#fff}
.d i{width:6px;height:6px;border-radius:50%}.st-a{background:var(--sky)}.st-n{background:#e8a317}.st-f{background:#c0504d}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:10px}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:8px;height:8px;border-radius:50%}
.det{margin-top:14px;border-top:1.5px solid var(--line);padding-top:14px;display:grid;gap:8px}.det h3{font-size:21px}.det .meta{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:var(--azure)}
.det .go{display:flex;justify-content:space-between;align-items:center;gap:12px}.det .btn{padding:11px 22px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ov{position:fixed;inset:0;background:rgba(8,39,69,.62);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.mod{background:var(--bg);border-radius:28px;padding:30px;width:min(580px,100%);max-height:92vh;overflow:auto}.mod h2{font-size:30px;margin-bottom:6px}.mod .sub{color:var(--soft);margin:0 0 20px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.chk input{width:auto;margin-top:5px}
.acts{display:flex;justify-content:space-between;gap:12px}
.track{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(32px,6vw,90px);align-items:center}.track h2{font-size:clamp(32px,4.6vw,56px);margin-bottom:14px}
.found{background:var(--mist);border-radius:24px;padding:24px;margin-top:20px}.found h3{font-size:24px}.err{color:#c0504d;font-weight:600;margin-top:10px}
@media(max-width:820px){.track{grid-template-columns:1fr}}
</style></head>

 return{id,date:d,a:t[0],b:t[1],via:t[2],time:t[3],fee:t[4],booked,left,status:left===0?'Fully booked':left<=2?'Nearly full':'Available'}}

function Calendar({bk,sel,setSel,onBook}){
 const [m,setM]=useState(new Date(sel.getFullYear(),sel.getMonth(),1));
 const lead=m.getDay(),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),trip=tripOn(sel,bk);
 const minM=new Date(today.getFullYear(),today.getMonth(),1),maxM=new Date(today.getFullYear(),today.getMonth()+3,1);
 return(<div className="cal" id="calendar">
  <div className="cal-h"><button aria-label="Previous month" disabled={m<=minM} onClick={()=>setM(new Date(m.getFullYear(),m.getMonth()-1,1))}>‹</button>
   <h2>{MS[m.getMonth()]} {m.getFullYear()}</h2>
   <button aria-label="Next month" disabled={m>=maxM} onClick={()=>setM(new Date(m.getFullYear(),m.getMonth()+1,1))}>›</button></div>
  <div className="dow">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=><span key={x}>{x}</span>)}</div>
  <div className="days">{Array.from({length:lead}).map((_,i)=><span key={'b'+i}/>)}
   {Array.from({length:n},(_,i)=>{const d=new Date(m.getFullYear(),m.getMonth(),i+1),t=tripOn(d,bk),on=d.getTime()===sel.getTime();
    return <button key={i} className={'d'+(on?' sel':'')} disabled={d<today||!t} onClick={()=>setSel(d)} aria-label={fmt(d)+(t?', '+t.status:', no trip')}>{i+1}{t&&d>=today&&<i className={dot(t.status)}/>}</button>})}</div>
  <div className="leg"><span><i className="st-a"/>Available</span><span><i className="st-n"/>Nearly full</span><span><i className="st-f"/>Fully booked</span></div>
  <div className="det" aria-live="polite">{trip&&sel>=today?<>
   <h3>{trip.a} to {trip.b}</h3>
   <div className="meta"><span className="pill">{fmt(sel)}</span><span className="pill">Departs {trip.time}</span><span className="pill">via {trip.via}</span></div>
   <div className="bar"><b style={{width:trip.booked/CAP*100+'%'}}/></div>
   <div className="go"><span><b>{trip.status}</b>: {trip.left} of {CAP} slots left. ₱{trip.fee.toLocaleString()} per pet</span>
   <button className="btn" disabled={trip.left===0} onClick={()=>onBook(trip)}>{trip.left===0?'Fully booked':'Book this trip'}</button></div></>:<p style={{margin:0,color:'var(--soft)'}}>No trip on this day. Pick a day with a dot.</p>}</div></div>)}
function Booking({trip,onClose,onDone}){
 const [s,setS]=useState(1),[f,setF]=useState({type:'Dog',breed:'',age:'',weight:'',cage:'own',name:'',phone:'',pickup:'',dropoff:'',health:false,terms:false}),[res,setRes]=useState(null);
 const set=k=>e=>setF({...f,[k]:e.target.type==='checkbox'?e.target.checked:e.target.value});
 const total=trip.fee+(f.cage==='rent'?300:0);
 useEffect(()=>{const k=e=>e.key==='Escape'&&onClose();addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
 useLayoutEffect(()=>{if(!matchMedia('(prefers-reduced-motion: reduce)').matches)gsap.from('.mod',{y:40,opacity:0,duration:.5,ease:'power3.out'})},[]);
 const next=e=>{e.preventDefault();if(s<3)return setS(s+1);
  const code='WOP-'+Math.floor(1000+Math.random()*9000),b={...f,code,tripId:trip.id,route:trip.a+' to '+trip.b,date:fmt(trip.date),time:trip.time,total,status:'Request received'};setRes(b);onDone(b);setS(4)};
 return(<div className="ov" onMouseDown={e=>e.target===e.currentTarget&&onClose()}><div className="mod" role="dialog" aria-modal="true" aria-label="Book a trip">
  {s<4?<><h2>{['Your pet','Your details','Health and terms'][s-1]}</h2>
  <p className="sub">Step {s} of 3 · {trip.a} to {trip.b}, {fmt(trip.date)}, {trip.time}</p>
  <form onSubmit={next}>
  {s===1&&<><label>Type of animal<select value={f.type} onChange={set('type')}>{['Dog','Cat','Rabbit','Bird','Other'].map(o=><option key={o}>{o}</option>)}</select></label>
   <label>Breed<input required autoFocus value={f.breed} onChange={set('breed')}/></label>
   <label>Age<input required value={f.age} onChange={set('age')} placeholder="e.g. 3 years"/></label>
   <label>Weight (kg)<input required type="number" min="0.1" step="0.1" value={f.weight} onChange={set('weight')}/></label>
   <label className="full">Cage<select value={f.cage} onChange={set('cage')}><option value="own">I have my own cage</option><option value="rent">I need a cage from World of Pets (+₱300)</option></select></label></>}
  {s===2&&<><label>Full name<input required autoFocus value={f.name} onChange={set('name')} autoComplete="name"/></label>
   <label>Mobile number<input required type="tel" value={f.phone} onChange={set('phone')} autoComplete="tel"/></label>
   <label className="full">Pickup address<input required value={f.pickup} onChange={set('pickup')}/></label>
   <label className="full">Drop-off address<input required value={f.dropoff} onChange={set('dropoff')}/></label></>}
  {s===3&&<><label className="chk full"><input required type="checkbox" checked={f.health} onChange={set('health')}/>I confirm my pet is healthy and fit to travel.</label>
   <label className="chk full"><input required type="checkbox" checked={f.terms} onChange={set('terms')}/>I have read and agree to the transportation terms and conditions. World of Pets will confirm this booking by phone.</label>
   <p className="full" style={{margin:0}}><b>Total: ₱{total.toLocaleString()}</b> ({f.cage==='rent'?'fare + cage rental':'fare only'})</p></>}
  <div className="full acts">{s>1?<button type="button" className="btn ghost" onClick={()=>setS(s-1)}>Back</button>:<button type="button" className="btn ghost" onClick={onClose}>Cancel</button>}
   <button className="btn" type="submit">{s<3?'Continue':'Submit booking'}</button></div></form></>:
  <><h2>Booking submitted</h2><p className="sub">Save your reference code to track this booking.</p>
   <div className="found"><h3>{res.code}</h3><p style={{margin:'8px 0 0'}}>{res.route}, {res.date}<br/>{res.type}, {res.breed} · Total ₱{res.total.toLocaleString()}</p></div>
   <p>We will call {res.phone} to confirm.</p><div className="acts"><a className="btn ghost" href="#track" onClick={onClose}>Track a booking</a><button className="btn" onClick={onClose}>Done</button></div></>}
 </div></div>)}
function App(){
 const root=useRef(null);
 const [bk,setBk]=useState(()=>{try{return JSON.parse(localStorage.getItem('wop-bookings'))||[]}catch(e){return[]}});
 const [sel,setSel]=useState(()=>{let d=new Date(today);for(let i=0;i<8;i++){if(TPL[d.getDay()]&&tripOn(d,[]).left>0)break;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return d});
 const [book,setBook]=useState(null),[q,setQ]=useState(''),[hit,setHit]=useState(null),[err,setErr]=useState('');
 const add=b=>{const n=[...bk,b];setBk(n);try{localStorage.setItem('wop-bookings',JSON.stringify(n))}catch(e){}};
 const look=e=>{e.preventDefault();const h=bk.find(b=>b.code===q.trim().toUpperCase());setHit(h||null);setErr(h?'':'No booking found for that code. Check the code or call us.')};
 useLayoutEffect(()=>{gsap.registerPlugin(ScrollTrigger);
  const ctx=gsap.context(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
   gsap.timeline({defaults:{ease:'power4.out'}}).from('.wm i',{yPercent:110,duration:1.1,stagger:.045})
    .from('.cal',{clipPath:'inset(0 0 100% 0)',y:50,duration:1.2,ease:'power3.inOut'},.3)
    .from('.hero h1,.hero p,.cta',{y:28,opacity:0,duration:.9,stagger:.12},.6).from('.nav',{opacity:0,duration:.8},.2);
   gsap.utils.toArray('.ln').forEach(l=>gsap.from(l,{scaleX:0,duration:1.2,ease:'power3.out',scrollTrigger:{trigger:l,start:'top 92%'}}));
   gsap.from('.feat .f',{opacity:0,y:50,stagger:.18,duration:1,ease:'power3.out',scrollTrigger:{trigger:'.feat .cols',start:'top 80%'}})},root);
  return()=>ctx.revert()},[]);
 const trip=tripOn(sel,bk);
 const SV=[['Door-to-door pickup','We collect your pet in Surallah, Koronadal or General Santos and hand them over at the destination address.',['Pickup','Drop-off']],['Cage rental','Clean, ventilated cages with fleece lining and a water bowl, for pets that travel without their own.',['+₱300 per trip']],['Health declaration','You confirm your pet is healthy and fit to travel when you book, so we can plan the trip safely.',['At booking']],['Booking tracking','Use your reference code to check the status of your booking any time.',['Reference code']]];
 return(<div ref={root}>
 <header className="hero"><div className="wrap" style={{width:'100%'}}>
  <nav className="nav" aria-label="Main"><a className="brand" href="#top"><img src={LOGO} alt="World of Pets logo"/>World of Pets</a>
   <ul><li><a href="#calendar">Trip calendar</a></li><li><a href="#services">Services</a></li><li><a href="#van">In the van</a></li><li><a href="#track">Track booking</a></li></ul>
   <a className="btn" href="#calendar">Book a trip</a></nav></div>
  <div className="wrap hero-body" style={{width:'100%'}}><div>
   <h1>Pet travel across Mindanao, door to door.</h1>
   <p>Choose a day on the calendar to see the route, departure time and open slots, then book in three steps.</p>
   <div className="cta"><button className="btn" disabled={!trip||trip.left===0} onClick={()=>setBook(trip)}>Book {fmt(sel).split(',')[1]}</button><a className="btn ghost" href="#track">Track a booking</a></div></div>
   <Calendar bk={bk} sel={sel} setSel={setSel} onBook={setBook}/></div>
  <div className="wm" aria-hidden="true">{[...'World of Pets'].map((c,i)=>c===' '?<i key={i} className="sp"/>:<i key={i} className={i>5?'n':''}>{c}</i>)}</div>
 </header>
 <main>
 <section id="services" className="svc"><div className="wrap">
  <div className="head"><h2>What we take care of</h2><p>You bring the pet. We handle the van, the cage and the booking.</p></div>
  <div className="grid">{SV.map(s=><div className="item" key={s[0]}><h3>{s[0]}</h3><p>{s[1]}</p>{s[2].map(x=><span className="pill" key={x} style={{marginRight:8}}>{x}</span>)}<div className="ln" style={{position:'absolute',left:0,right:0,bottom:0,height:'1.5px',background:'var(--line)',transformOrigin:'left'}}/></div>)}</div></div></section>
 <section id="van" className="feat"><div className="wrap"><h2 className="big">A van built around how pets handle a long drive.</h2>
  <div className="cols"><div className="f"><h3>Cool from start to finish</h3><p>Rear air-conditioning runs the whole trip and the cabin temperature is checked on every stop.</p></div>
   <div className="f"><h3>Padded against bumps</h3><p>Anti-vibration padding under every cage keeps the ride steady on provincial highways.</p></div>
   <div className="f"><h3>Quiet inside</h3><p>Noise-damping panels and water bowls keep nervous pets calmer.</p></div></div></div></section>
 <section id="track"><div className="wrap track">
  <div><h2>Track your booking</h2><p style={{color:'var(--soft)',maxWidth:'36ch'}}>Enter the reference code you received when you booked.</p>
   <form onSubmit={look} style={{gridTemplateColumns:'1fr auto',alignItems:'end'}}><label>Reference code<input value={q} onChange={e=>setQ(e.target.value)} placeholder="WOP-1234" required/></label><button className="btn" type="submit">Check status</button></form>
   {err&&<p className="err" role="alert">{err}</p>}
   {hit&&<div className="found" role="status"><h3>{hit.code}: {hit.status}</h3><p style={{margin:'8px 0 0'}}>{hit.route}, {hit.date}, {hit.time}<br/>{hit.type}, {hit.breed}, {hit.weight} kg · Total ₱{hit.total.toLocaleString()}<br/>We will call {hit.phone} to confirm.</p></div>}</div>
  <div className="pets" style={{justifySelf:'end'}}><img src={PETS} alt="An orange cat and a chocolate puppy looking up"/></div></div></section>
 </main>
 <footer><div className="wrap"><div className="cols">
  <div><img className="logo" src={LOGO} alt=""/><p>Pet transport from Surallah, South Cotabato.</p></div>
  <div><h3>Visit</h3><p>Allah Valley Drive, Brgy. Libertad, Surallah, South Cotabato</p></div>
  <div><h3>Contact</h3><a href="tel:09853828738">0985 382 8738</a><a href="tel:09455215742">0945 521 5742</a><p>Facebook: World of Pets PH</p></div></div>
  <div className="legal">© 2026 World of Pets</div></div></footer>
 {book&&<Booking trip={book} onClose={()=>setBook(null)} onDone={add}/>}
 </div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
